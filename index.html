<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0404" />
  <title>Phoenix Legacy — Welcome</title>
  <meta name="description" content="Welcome to Phoenix Legacy (PH-L), a Dark War Survival alliance. Open the APC Console for events and member tools." />
  <link rel="icon" href="legacy/apc-console/assets/phl-logo.png?v=2" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="legacy/apc-console/styles.css?v=162" />
  <link rel="stylesheet" href="home.css?v=7" />
</head>
<body class="home-page">
  <div class="bg-cinematic" aria-hidden="true">
    <video
      class="bg-cinematic-video"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      poster="legacy/apc-console/assets/phl-logo.png?v=2"
    >
      <source src="legacy/apc-console/assets/PHLL.mov?v=157" type="video/mp4" />
    </video>
    <div class="bg-cinematic-scrim"></div>
  </div>
  <div class="noise" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar home-topbar">
    <div class="topbar-main">
      <a class="brand brand-home" href="/">
        <div class="brand-mark">
          <img src="legacy/apc-console/assets/phl-logo.png?v=2" alt="Phoenix Legacy" width="48" height="48" decoding="async" />
        </div>
        <div class="brand-copy">
          <strong>Phoenix Legacy</strong>
          <small>From Ashes, We Rise Together</small>
        </div>
      </a>
      <div class="top-actions">
        <a class="btn btn-ghost" href="legacy/apc-console/">APC Console</a>
        <a class="btn btn-primary" href="legacy/apc-console/?signin=1">Sign in</a>
      </div>
    </div>
  </header>

  <main class="home-shell">
    <section class="home-hero">
      <p class="home-eyebrow">Welcome · PH-L Alliance</p>
      <h1 class="home-title">From Ashes, We Rise Together</h1>
      <div class="home-hero-actions">
        <a class="btn btn-primary" href="legacy/apc-console/">APC Console</a>
        <a class="btn btn-ghost" href="legacy/apc-console/?signin=1">Sign in</a>
      </div>
    </section>
  </main>
</body>
</html>
